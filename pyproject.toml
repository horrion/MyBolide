[project]
name = "mybolide"
version = "0.1.0"
description = "Listen-only BMW E39/E46 iBus logger for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dbus-next>=0.2.3",
  "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mybolide = "mybolide.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
